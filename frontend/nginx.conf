server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 1m;
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
